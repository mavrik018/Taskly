name: taskflow
description: "TaskFlow: A beautifully designed, accessible, offline-first to-do list mobile app built in Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Routing
  go_router: ^17.3.0

  # UI & Design System
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0
  flutter_screenutil: ^5.9.0
  cupertino_icons: ^1.0.8

  # Notifications & Storage
  flutter_local_notifications: ^22.0.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  path: ^1.9.0
  timezone: ^0.11.0

  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.9
  drift_dev: ^2.16.0
  riverpod_generator: ^4.0.4-dev.1

  # Testing
  mocktail: ^1.0.4

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.jpeg"


flutter:
  uses-material-design: true


